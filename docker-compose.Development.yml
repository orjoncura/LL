version: '3.8'
services:
  ll_data:
    image: postgres:15
    container_name: ll_data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - .docker/volumes/sql_data:/var/lib/postgresql/data
    networks:
      - bridge_net

  ll_api:
    image: orjoncura/ll_api:1.0.0.0
    container_name: ll_api
    networks:
      - bridge_net
    depends_on:
      - ll_data
    env_file:
      - .env.dev
    ports:
      - "5197:5000"

  deepseek:
    image: docker.io/ollama/ollama
    container_name: deepseek
    ports:
      - "11434:11434"
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ~/.docker/volumes/ollama_data:/root/.ollama
    networks:
      - bridge_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped

  ll_webui:
    image: orjoncura/ll_webui:1.0.0.0
    container_name: ll_webui
    networks:
      - bridge_net
    depends_on:
      - ll_api
    ports:
      - "3000:3000"

  whisper-api:
    image: orjoncura/whisper-api:latest
    container_name: whisper-api
    networks:
      - bridge_net
    ports:
      - "8000:8000"

networks:
  bridge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
